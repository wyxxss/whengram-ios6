<script>
(function(){
var KEY='whengram-ios6-v2', state={name:'Илюша',memories:[],milestones:[],introSeen:false}, page='home', edit=null, query='';
function load(){try{var x=localStorage.getItem(KEY);if(x){var o=JSON.parse(x);for(var k in o)state[k]=o[k];}}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));return true;}catch(e){msg('Память браузера заполнена. Удали часть вложений или экспортируй записи.');return false;}}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function iso(){var d=new Date();return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);}
function dateLabel(s){var p=(s||iso()).split('-');return p[2]+'.'+p[1]+'.'+p[0];}
function msg(s){var n=document.getElementById('notice');n.innerHTML=esc(s);n.style.display='block';window.setTimeout(function(){n.style.display='none';},2300);}
function setNav(title,left,right){document.getElementById('navtitle').innerHTML=title;var l=document.getElementById('leftBtn'),r=document.getElementById('rightBtn');l.style.display=left?'block':'none';r.style.display=right?'block':'none';l.innerHTML=left||'';r.innerHTML=right||'';}
function btn(label,act,cls){return '<button class="button '+(cls||'')+'" data-action="'+act+'">'+label+'</button>';}
function row(item,type){var at=item.attachments&&item.attachments.length?'<div class="rowdetail">Вложений: '+item.attachments.length+'</div>':'';var photo='';if(item.attachments)for(var i=0;i<item.attachments.length;i++){if(item.attachments[i].kind==='image'){photo+='<img class="thumb" src="'+item.attachments[i].data+'" alt="Фото">';break;}}
return '<div class="row" data-open="'+esc(item.id)+'" data-type="'+type+'"><div class="entrydate">'+esc((item.date||iso()).split('-')[2])+'<small>'+esc((item.date||iso()).substring(0,7))+'</small></div><div class="entrycopy"><div class="chevron">›</div><div class="entrytitle">'+esc(item.title||'Без названия')+'</div><div class="entrytext">'+esc(item.text||'')+'</div>'+at+photo+'</div><div style="clear:both"></div></div>';}
function home(){var d=new Date(), names=['ВС','ПН','ВТ','СР','ЧТ','ПТ','СБ'], week='', i;for(i=0;i<7;i++){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate()-d.getDay()+i);week+='<td class="'+(x.toDateString()===d.toDateString()?'today':'')+'">'+names[x.getDay()]+'<b>'+x.getDate()+'</b></td>';}
var latest=state.memories.slice().sort(function(a,b){return b.date.localeCompare(a.date);})[0];
setNav('WHENGRAM',null,null);
return '<div class="brandplate"><div class="brand">WHENGRAM<span class="dot">.</span></div><div class="tagline">PERSONAL TIME CAPSULE</div></div><div class="datebar">'+dateLabel(iso())+'</div><div class="panel"><div class="panelhead">ДОБРОЕ УТРО, '+esc(state.name)+'</div><div class="panelbody"><div class="question">Что сегодня произошло?</div><div class="muted">Оставь здесь момент, который не хочется потерять. Когда-нибудь он станет частью твоей истории.</div>'+btn('✎ &nbsp; Написать воспоминание','new-memory','red')+'</div></div><div class="panel"><div class="panelhead">WHENWEEK</div><div class="panelbody"><table class="week"><tr>'+week+'</tr></table><div class="smallnote">Записей: '+state.memories.length+' &nbsp; · &nbsp; Вех: '+state.milestones.length+'</div></div></div>'+(latest?'<div class="panel"><div class="panelhead">ПОСЛЕДНЯЯ ЗАПИСЬ</div>'+row(latest,'memory')+'</div>':'<div class="panel"><div class="empty"><div class="emptyicon">✎</div><strong>Капсула пока пуста</strong>Первая запись — начало твоего личного архива.</div></div>')+'<div class="smallnote" style="text-align:center">Локальный режим · данные остаются на устройстве</div>';}
function listPage(type){var isM=type==='memory', arr=(isM?state.memories:state.milestones).slice().sort(function(a,b){return b.date.localeCompare(a.date);}), out='', count=0;for(var i=0;i<arr.length;i++){if(!query||(arr[i].title+' '+arr[i].text).toLowerCase().indexOf(query.toLowerCase())>=0){out+=row(arr[i],type);count++;}}
setNav(isM?'Воспоминания':'Вехи',null,'＋ Новое');
var search=isM?'<div style="padding:10px"><input class="field" id="searchBox" placeholder="Поиск воспоминаний..." value="'+esc(query)+'"></div>':'';
return search+'<div class="panel"><div class="panelhead">'+(isM?'МОЯ ИСТОРИЯ':'ВАЖНЫЕ СОБЫТИЯ')+' <span class="badge">'+count+'</span></div>'+(out||'<div class="empty"><div class="emptyicon">'+(isM?'▤':'★')+'</div><strong>'+(query?'Ничего не найдено':'Пока пусто')+'</strong>'+(isM?'Здесь будут храниться твои записи и фотографии.':'Отметь момент, который многое значит.')+'</div>')+'</div>'+(isM?'<div class="smallnote">Совет: короткие заголовки удобно просматривать в хронологии.</div>':'');}
function formPage(type,item){var isM=type==='memory';setNav(item?'Изменить запись':(isM?'Воспоминание':'Новая веха'),'Отмена',null);
var at=item&&item.attachments?item.attachments:(edit&&edit.attachments?edit.attachments:[]), attachments='';
for(var i=0;i<at.length;i++){attachments+='<div class="row"><div class="rowtitle">'+esc(at[i].name)+'</div><div class="rowdetail">'+esc(at[i].kind==='image'?'Изображение':'Файл')+'</div><button class="button gray" type="button" data-remove-attachment="'+i+'">Убрать вложение</button>'+(at[i].kind==='image'?'<img class="thumb" src="'+at[i].data+'" alt="Вложение">':'')+'</div>';}
return '<form id="entryForm" data-type="'+type+'" data-id="'+(item?esc(item.id):'')+'"><div class="panel"><div class="panelhead">'+(isM?'СОХРАНИ МОМЕНТ':'ОТМЕТЬ ВЕХУ')+'</div><div class="panelbody"><label class="fieldlabel">Дата</label><input class="field" type="date" name="date" value="'+esc(item?item.date:iso())+'" required><label class="fieldlabel">Заголовок</label><input class="field" name="title" maxlength="100" value="'+esc(item?item.title:'')+'" placeholder="Что произошло?" required><label class="fieldlabel">Описание</label><textarea class="area" name="text" maxlength="6000" placeholder="Запиши детали, мысли и ощущения...">'+esc(item?item.text:'')+'</textarea>'+(isM?'<label class="fieldlabel">Настроение</label><select class="select" name="mood"><option value="">Не указано</option>'+['Радость','Спокойствие','Волнение','Грусть','Благодарность','Удивление'].map(function(m){return '<option '+(item&&item.mood===m?'selected':'')+'>'+m+'</option>';}).join('')+'</select>':'')+'<label class="fieldlabel">Фото и вложения</label><div class="attach"><input type="file" id="fileInput" accept="image/*" multiple><div class="smallnote">Фото сохраняются внутри записи. Для старого Safari лучше добавлять изображения небольшого размера.</div></div>'+attachments+'</div></div>'+btn(item?'Сохранить изменения':'Сохранить запись','submit-form','')+(item?'<button type="button" class="button gray" data-action="delete">Удалить запись</button>':'')+'<div class="smallnote">Не закрывай страницу, пока выбранные фотографии обрабатываются.</div></form>';}
function settings(){setNav('Настройки',null,null);return '<div class="panel"><div class="panelhead">ПРОФИЛЬ</div><div class="panelbody"><label class="fieldlabel">Имя в приветствии</label><input class="field" id="nameField" maxlength="30" value="'+esc(state.name)+'"><button class="button" data-action="save-name">Сохранить имя</button></div></div><div class="panel"><div class="panelhead">ХРАНЕНИЕ И ПРИВАТНОСТЬ</div><div class="panelbody"><div class="rowtitle">Работа без интернета</div><div class="rowdetail">После первой загрузки сайт может открываться офлайн, если Safari сохранил кэш приложения. Записи хранятся локально.</div>'+btn('Экспортировать резервную копию','export','')+'<div style="height:8px"></div><label class="fieldlabel">Восстановить из JSON</label><input type="file" id="importFile" accept="application/json,.json"><div class="smallnote">Резервная копия содержит тексты и вложенные изображения. Храни её в надёжном месте.</div></div></div><div class="panel"><div class="panelhead">ВАЖНО</div><div class="panelbody muted">Safari на iOS 6 имеет ограниченное хранилище и старый механизм App Cache. Это прототип без сервера и аккаунта. Очистка данных Safari может удалить записи; регулярно делай экспорт.</div></div>';}
function render(){var v=document.getElementById('view');if(edit){v.innerHTML=formPage(edit.type,edit.item);}else if(page==='home')v.innerHTML=home();else if(page==='memories')v.innerHTML=listPage('memory');else if(page==='milestones')v.innerHTML=listPage('milestone');else v.innerHTML=settings();
var tabs=document.getElementsByClassName('tab');for(var i=0;i<tabs.length;i++)tabs[i].className='tab'+(tabs[i].getAttribute('data-tab')===page?' active':'');
var sb=document.getElementById('searchBox');if(sb)sb.addEventListener('input',function(){query=this.value;var pos=this.selectionStart;render();var b=document.getElementById('searchBox');if(b){b.focus();try{b.setSelectionRange(pos,pos);}catch(e){}}});
var fi=document.getElementById('fileInput');if(fi)fi.addEventListener('change',handleFiles);
var imp=document.getElementById('importFile');if(imp)imp.addEventListener('change',handleImport);
}
function navigate(p){page=p;edit=null;query='';render();window.scrollTo(0,0);}
function openEditor(type,item){edit={type:type,item:item||null,attachments:item&&item.attachments?item.attachments:[]};render();window.scrollTo(0,0);}
function find(type,id){var a=type==='memory'?state.memories:state.milestones;for(var i=0;i<a.length;i++)if(String(a[i].id)===String(id))return a[i];return null;}
function handleFiles(e){var files=e.target.files;if(!files||!files.length)return;var type=edit.type, id=edit.item?edit.item.id:null, existing=edit.item&&edit.item.attachments?edit.item.attachments:(edit.attachments||[]);var pending=files.length;
function done(){pending--;if(pending<=0){if(edit&&edit.item)edit.item.attachments=existing;else if(edit)edit.attachments=existing;render();msg('Вложения добавлены к черновику');}}
for(var i=0;i<files.length;i++)(function(file){if(!file.type||file.type.indexOf('image/')!==0){existing.push({name:file.name,kind:'file',data:'',size:file.size});done();return;}
var reader=new FileReader();reader.onload=function(ev){var data=ev.target.result;var im=new Image();im.onload=function(){var max=900,w=im.width,h=im.height;if(w>max||h>max){var scale=Math.min(max/w,max/h);w=Math.round(w*scale);h=Math.round(h*scale);var c=document.createElement('canvas');c.width=w;c.height=h;var ctx=c.getContext('2d');ctx.drawImage(im,0,0,w,h);try{data=c.toDataURL('image/jpeg',0.72);}catch(ex){}}existing.push({name:file.name,kind:'image',data:data,size:data.length});done();};im.onerror=function(){existing.push({name:file.name,kind:'image',data:data,size:data.length});done();};im.src=data;};reader.onerror=function(){done();msg('Не удалось прочитать файл');};reader.readAsDataURL(file);})(files[i]);
}
function saveForm(form){var type=form.getAttribute('data-type'),id=form.getAttribute('data-id'),old=id?find(type,id):null, data={id:id||String(new Date().getTime()),date:form.elements.date.value||iso(),title:form.elements.title.value,text:form.elements.text.value,mood:form.elements.mood?form.elements.mood.value:'',attachments:old&&old.attachments?old.attachments:(edit&&edit.attachments?edit.attachments:[])};var a=type==='memory'?state.memories:state.milestones,found=false;for(var i=0;i<a.length;i++)if(id&&String(a[i].id)===String(id)){a[i]=data;found=true;break;}if(!found)a.push(data);if(save()){edit=null;page=type==='memory'?'memories':'milestones';query='';render();window.scrollTo(0,0);msg('Запись сохранена на устройстве');}}
function exportData(){try{var blob=new Blob([JSON.stringify(state)],{type:'application/json'});var url=window.URL.createObjectURL(blob);var a=document.createElement('a');a.href=url;a.download='whengram-backup.json';document.body.appendChild(a);a.click();document.body.removeChild(a);window.setTimeout(function(){window.URL.revokeObjectURL(url);},1000);msg('Резервная копия подготовлена');}catch(e){msg('Экспорт не поддерживается этим браузером');}}
function handleImport(e){var file=e.target.files&&e.target.files[0];if(!file)return;var r=new FileReader();r.onload=function(){try{var data=JSON.parse(r.result);if(!data.memories||!data.milestones)throw new Error('format');if(confirm('Заменить текущие данные резервной копией?')){state=data;save();render();msg('Данные восстановлены');}}catch(ex){msg('Файл резервной копии не распознан');}};r.readAsText(file);}
document.addEventListener('click',function(e){var t=e.target;while(t&&t!==document&&!t.getAttribute('data-action')&&!t.getAttribute('data-tab')&&!t.getAttribute('data-open')&&!t.getAttribute('data-remove-attachment'))t=t.parentNode;if(!t||t===document)return;
var tab=t.getAttribute('data-tab');if(tab){navigate(tab);return;}
var act=t.getAttribute('data-action');if(act==='new-memory'){openEditor('memory');return;}if(act==='new-milestone'){openEditor('milestone');return;}if(act==='save-name'){state.name=document.getElementById('nameField').value||'Друг';save();render();msg('Имя сохранено');return;}if(act==='export'){exportData();return;}if(act==='delete'){if(confirm('Удалить запись?')){var a=edit.type==='memory'?state.memories:state.milestones;for(var i=a.length-1;i>=0;i--)if(String(a[i].id)===String(edit.item.id))a.splice(i,1);save();page=edit.type==='memory'?'memories':'milestones';edit=null;render();msg('Запись удалена');}return;}
if(t.id==='leftBtn'){if(edit){edit=null;render();}else navigate('home');return;}if(t.id==='rightBtn'){if(page==='memories')openEditor('memory');else if(page==='milestones')openEditor('milestone');return;}
var rm=t.getAttribute('data-remove-attachment');if(rm!==null&&edit){var ea=edit.item?edit.item.attachments:edit.attachments;if(ea){ea.splice(parseInt(rm,10),1);if(edit.item)edit.item.attachments=ea;else edit.attachments=ea;}render();return;}
var oid=t.getAttribute('data-open');if(oid){var ty=t.getAttribute('data-type'),it=find(ty,oid);if(it)openEditor(ty,it);return;}
});
document.addEventListener('submit',function(e){if(e.target.id==='entryForm'){e.preventDefault();if(e.submitter&&e.submitter.getAttribute('data-action')==='submit-form'){}saveForm(e.target);}});
load();render();
})();
</script>

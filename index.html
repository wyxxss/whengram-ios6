  <script>
    let audioCtx = null;
    function getAudioCtx() {
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (AudioContextClass) audioCtx = new AudioContextClass();
      }
      if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }

    function playSound(type) {
      if (!state.settings.soundEffects) return;
      try {
        const ctx = getAudioCtx();
        if (!ctx) return;
        const now = ctx.currentTime;
        if (type === 'tock') {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(920, now);
          osc.frequency.exponentialRampToValueAtTime(190, now + 0.028);
          gain.gain.setValueAtTime(0.28, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.03);
          osc.connect(gain); gain.connect(ctx.destination);
          osc.start(now); osc.stop(now + 0.032);
        } else if (type === 'shutter') {
          const bufferSize = ctx.sampleRate * 0.09;
          const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
          const data = buffer.getChannelData(0);
          for (let i = 0; i < bufferSize; i++) data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (ctx.sampleRate * 0.02));
          const noise = ctx.createBufferSource(); noise.buffer = buffer;
          const filter = ctx.createBiquadFilter(); filter.type = 'bandpass'; filter.frequency.value = 1800;
          const gain = ctx.createGain(); gain.gain.setValueAtTime(0.45, now);
          noise.connect(filter); filter.connect(gain); gain.connect(ctx.destination);
          noise.start(now);
        } else if (type === 'stamp') {
          const osc = ctx.createOscillator(); const gain = ctx.createGain();
          osc.type = 'sine'; osc.frequency.setValueAtTime(150, now);
          osc.frequency.exponentialRampToValueAtTime(42, now + 0.14);
          gain.gain.setValueAtTime(0.45, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.16);
          osc.connect(gain); gain.connect(ctx.destination);
          osc.start(now); osc.stop(now + 0.17);
        } else if (type === 'cassette') {
          [261.63, 329.63, 392.00, 493.88].forEach((f, idx) => {
            const osc = ctx.createOscillator(); const gain = ctx.createGain();
            osc.type = 'sine'; osc.frequency.setValueAtTime(f, now + idx * 0.04);
            gain.gain.setValueAtTime(0.08, now + idx * 0.04);
            gain.gain.exponentialRampToValueAtTime(0.0008, now + 1.1);
            osc.connect(gain); gain.connect(ctx.destination);
            osc.start(now + idx * 0.04); osc.stop(now + 1.15);
          });
        }
      } catch (e) {}
    }

      currentTab: 'home',

      ]

    let state = loadState();
    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return JSON.parse(JSON.stringify(DEFAULT_STATE));
        return { ...DEFAULT_STATE, ...JSON.parse(raw) };
      } catch (e) { return JSON.parse(JSON.stringify(DEFAULT_STATE)); }
    }
    function saveState() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {} }

    function initApp() { applyThemeClass(); updateClock(); setInterval(updateClock, 15000); renderApp(); }
    function updateClock() {
      const el = document.getElementById('statusBarClock');
      if (!el) return;
      const now = new Date();
      el.textContent = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
    }
    function applyThemeClass() {

      `;
    }

    function selectDraftMood(id) { playSound('tock'); draftMood = id; MOODS.forEach(m => document.getElementById(`moodBtn_${m.id}`).className = `p-1 rounded border text-center ${m.id === draftMood ? 'bg-amber-200 border-amber-700 font-extrabold' : 'bg-white/70 border-gray-300'}`); }
    function selectDraftPhoto(id, flt) { playSound('shutter'); draftPreset = id; draftFilter = flt; PHOTO_PRESETS.forEach(p => document.getElementById(`photoBtn_${p.id}`).className = `p-1 rounded border text-center ${p.id === draftPreset ? 'border-[#c9381e] bg-amber-100 font-bold' : 'bg-white'}`); }

    function saveNewMemory(dayNum) {
      const title = document.getElementById('memTitleInput')?.value.trim() || 'Момент дня';
      const text = document.getElementById('memTextInput')?.value.trim() || 'Записано в капсулу времени.';
      const hasCassette = document.getElementById('memCassetteCheck')?.checked || false;
      playSound('shutter');
      state.memories.unshift({ id: 'mem_' + Date.now(), day: dayNum, month: 'ОКТЯБРЬ 2026', weekdayShort: 'ПН', dateFormatted: `${dayNum} октября 2026`, title, text, mood: draftMood, photoPreset: draftPreset, filter: draftFilter, hasCassette, cassetteTitle: 'Lo-Fi Кассета', weather: '+8°C' });
      saveState(); closeModal(); switchTab('memories');
    }

    let draftMilestoneIcon = 'fa-trophy';
    function openNewMilestoneModal() {
      playSound('tock');
      const modal = document.getElementById('modalContainer');
      modal.innerHTML = `
        <div class="ios6-alert-backdrop">
          <div class="ios6-alert-box">
            <div class="font-extrabold text-[15px] mb-1">Новая Веха Жизни</div>
            <p class="text-[11px] text-blue-100/80 mb-2.5">Запечатлейте важное достижение сургучной печатью:</p>
            <div class="space-y-2 text-left">
              <input id="msTitleInput" type="text" placeholder="Название вехи" class="w-full px-2.5 py-1.5 rounded bg-white text-black text-xs font-bold focus:outline-none" />
              <input id="msCatInput" type="text" placeholder="Категория" class="w-full px-2.5 py-1.5 rounded bg-white text-black text-xs focus:outline-none" />
              <textarea id="msNoteInput" rows="2" placeholder="Заметка..." class="w-full px-2.5 py-1.5 rounded bg-white text-black text-xs focus:outline-none resize-none"></textarea>
            </div>
            <div class="grid grid-cols-2 gap-2 mt-3">
              <button onclick="closeModal()" class="ios6-nav-btn justify-center py-1.5">Отмена</button>
              <button onclick="saveNewMilestone()" class="ios6-nav-btn red-action justify-center py-1.5"><i class="fa-solid fa-stamp"></i> Печать!</button>
            </div>
          </div>
        </div>
      `;
    }

    function saveNewMilestone() {
      const title = document.getElementById('msTitleInput')?.value.trim() || 'Важное событие';
      const category = document.getElementById('msCatInput')?.value.trim() || 'Веха';
      const note = document.getElementById('msNoteInput')?.value.trim() || '';
      playSound('stamp');
      state.milestones.unshift({ id: 'ms_' + Date.now(), title, category, date: '19 ОКТ 2026', icon: 'fa-trophy', note });
      saveState(); closeModal(); switchTab('milestones');
    }

    function openMemoryDetailModal(id) {
      playSound('tock');
      const m = state.memories.find(x => x.id === id);
      if (!m) return;
      const preset = PHOTO_PRESETS.find(p => p.id === m.photoPreset) || PHOTO_PRESETS[0];
      const modal = document.getElementById('modalContainer');
      modal.innerHTML = `
        <div class="ios6-alert-backdrop" onclick="closeModal()">
          <div class="paper-card p-3 w-[282px]" onclick="event.stopPropagation()">
            <div class="flex items-center justify-between text-[10px] font-bold text-[#786552] mb-2"><span>${m.dateFormatted}</span></div>
            <div class="polaroid-frame mx-auto mb-2.5">
              <div class="w-full h-32 rounded flex flex-col items-center justify-center text-white font-black text-3xl ${m.filter || ''}" style="background: ${preset.svgBg};"><span>${preset.icon}</span></div>
              <div class="text-center font-extrabold text-[12px] text-[#2b2118] mt-1.5">«${escapeHtml(m.title)}»</div>
            </div>
            <p class="text-[12px] text-[#3d3124] leading-snug mb-3 bg-[#f2ead8] p-2 rounded">${escapeHtml(m.text)}</p>
            <div class="flex gap-2">
              <button onclick="deleteMemory('${m.id}')" class="ios6-nav-btn red-action flex-1 justify-center"><i class="fa-solid fa-trash-can"></i> Удалить</button>
              <button onclick="closeModal()" class="ios6-nav-btn blue-action flex-1 justify-center">Закрыть</button>
            </div>
          </div>
        </div>
      `;
    }

    function openRandomCapsule() { playSound('stamp'); if (state.memories.length) openMemoryDetailModal(state.memories[Math.floor(Math.random() * state.memories.length)].id); }
    function deleteMemory(id) { playSound('tock'); state.memories = state.memories.filter(m => m.id !== id); saveState(); closeModal(); renderApp(); }
    function closeModal() { const modal = document.getElementById('modalContainer'); if (modal) modal.innerHTML = ''; }
    function escapeHtml(str) { return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }

    window.onload = initApp;
  </script>
</body>
</html>
